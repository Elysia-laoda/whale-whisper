<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="补充提示挂件">
  <title>dsh-whisper-whale</title>
  <defs>
    <linearGradient id="wwIconBody" x1="0.1" y1="0.05" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6C86FF"/>
      <stop offset="0.55" stop-color="#3A57DE"/>
      <stop offset="1" stop-color="#1E2E96"/>
    </linearGradient>
    <linearGradient id="wwIconTail" x1="0.1" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#6380FF"/>
      <stop offset="1" stop-color="#22339E"/>
    </linearGradient>
  </defs>

  <!-- 尾鳍：两片短肥叶瓣，圆头是半圆弧 -->
  <path d="M39.5 34.4C42.8 30.6 45.9 28.2 49.6 27.2A3.8 3.8 0 0 1 49.6 34.8C48.6 35.8 47.5 36.9 46.8 38C47.5 39.1 48.6 40.2 49.6 41.2A3.8 3.8 0 0 1 49.6 48.8C45.9 47.8 42.8 45.4 39.5 41.6Z" fill="url(#wwIconTail)"/>

  <!-- 胸鳍：贴着肚子向后掠 -->
  <path d="M16 45C19 52 24 56.5 31 56.5C29 51.5 26 47 23 44.6Z" fill="#2840B4"/>

  <!-- 身体：钝头、钝尾 -->
  <path d="M10 30C16 25.4 28 24.8 35 27.6C40 29.6 42.6 32.6 42.6 38C42.6 43.4 40 46.4 35 48.4C28 51.2 16 50.6 10 46C6.4 43.4 6.4 32.6 10 30Z" fill="url(#wwIconBody)"/>

  <!-- 眼睛 -->
  <circle cx="21" cy="36.5" r="2.9" fill="#0C1430"/>
  <circle cx="22.2" cy="35.4" r="1.05" fill="#FFFFFF"/>

  <!-- 嘴 -->
  <path d="M8.8 43.6C13.4 46.4 18.6 46.8 22.6 45.2" stroke="#16227A" stroke-width="1.7" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- 气泡：它在问你 -->
  <g>
    <path d="M13 18.5L21 18.5L13.5 26.5Z" fill="#E9EFFF"/>
    <rect x="8" y="3" width="26" height="16.5" rx="8.25" fill="#E9EFFF"/>
    <circle cx="14.5" cy="11.2" r="2" fill="#3A57DE"/>
    <circle cx="21" cy="11.2" r="2" fill="#3A57DE"/>
    <circle cx="27.5" cy="11.2" r="2" fill="#3A57DE"/>
  </g>
</svg>
