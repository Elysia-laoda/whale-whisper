<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<!--
  CSP：与 server.js 中资源 _meta.ui.csp 保持一致。
  本挂件完全离线运行（ext-apps 已内联），不依赖任何外部域名。
-->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self' 'unsafe-inline' data: blob:;
           script-src 'self' 'unsafe-inline';
           connect-src 'self';
           img-src 'self' data: blob:;
           style-src 'self' 'unsafe-inline';"
/>
<title>补充提示挂件</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#ffffff, #1f1f1f);
    --card: light-dark(#ffffff, #262626);
    --card2: light-dark(#f4f7fb, #2d2d2d);
    --fg: light-dark(#1a2230, #e8eaed);
    --fg2: light-dark(#5f6b7a, #9aa4b2);
    --line: light-dark(#e3e8f0, #3a3f47);
    --accent: #3b82f6;
    --accent-soft: light-dark(#e8f1ff, #23324a);
    --ok: #2fa96b;
    --warn: #e8930c;
    --err: #e5484d;
  }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"]  { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  body.pip { height: 100vh; display: flex; align-items: center; justify-content: center; }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 6px;
  }
  body.pip .wrap { padding: 0; }

  /* ---------- 气泡 ---------- */
  .bubble {
    position: relative;
    max-width: 260px;
    padding: 6px 12px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 4px 14px rgba(15, 40, 80, 0.10);
    font-size: 12px;
    line-height: 1.5;
    color: var(--fg);
    text-align: center;
    animation: pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }
  .bubble[hidden] { display: none; }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -5px;
    width: 9px;
    height: 9px;
    margin-left: -4.5px;
    background: var(--card);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    transform: rotate(45deg);
  }
  @keyframes pop {
    from { transform: scale(0.82) translateY(4px); opacity: 0; }
    to   { transform: scale(1) translateY(0);     opacity: 1; }
  }

  /* ---------- 主体卡片 ---------- */
  .card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px 9px 10px;
    border-radius: 18px;
    background: linear-gradient(180deg, var(--card), var(--card2));
    border: 1px solid var(--line);
    box-shadow: 0 6px 18px rgba(15, 40, 80, 0.10);
    cursor: pointer;
    transition: box-shadow 0.18s ease, transform 0.12s ease, border-color 0.18s ease;
  }
  .card:hover  { border-color: color-mix(in srgb, var(--accent) 42%, var(--line)); box-shadow: 0 8px 22px rgba(15, 40, 80, 0.16); }
  .card:active { transform: scale(0.985); }

  .mascot {
    position: relative;
    width: 52px; height: 52px;
    border-radius: 16px;
    background: radial-gradient(circle at 32% 26%, var(--accent-soft), transparent 72%);
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .mascot svg { display: block; }
  .whale  { animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 62%; }
  .spout  { opacity: 0; transition: opacity 0.2s ease; }
  .mascot.hop .whale { animation: hop 0.62s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .mascot.hop .spout { opacity: 1; animation: spout 0.9s ease-out; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2.5px); }
  }
  @keyframes hop {
    0%   { transform: translateY(0) scale(1); }
    38%  { transform: translateY(-7px) scale(1.06); }
    72%  { transform: translateY(1px) scale(0.97); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes spout {
    0%   { transform: translateY(3px); opacity: 0; }
    35%  { opacity: 1; }
    100% { transform: translateY(-4px); opacity: 0; }
  }

  .meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .title { font-size: 13px; font-weight: 650; letter-spacing: 0.2px; }
  .status {
    display: flex; align-items: center; gap: 5px;
    font-size: 11.5px; color: var(--fg2);
    max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--fg2); flex: none;
    transition: background 0.2s ease;
  }
  .dot.wait { background: var(--warn); animation: pulse 1.1s ease-in-out infinite; }
  .dot.ok   { background: var(--ok); }
  .dot.err  { background: var(--err); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--warn) 55%, transparent); }
    50%      { box-shadow: 0 0 0 5px transparent; }
  }

  /* ---------- 按钮区 ---------- */
  .actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; flex: none; }
  .btn {
    font: inherit; font-size: 11.5px;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--fg);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }
  .btn:hover  { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .btn:active { transform: scale(0.97); }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .btn.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); color: var(--accent); }

  /* ---------- 手动 / 预览面板 ---------- */
  .panel {
    width: 100%;
    max-width: 320px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 8px 10px;
    background: var(--card2);
    font-size: 11.5px;
    color: var(--fg2);
    display: flex; flex-direction: column; gap: 6px;
    animation: pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .panel[hidden] { display: none; }
  .panel textarea {
    width: 100%; resize: none;
    font: inherit; color: var(--fg);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    height: 66px;
    user-select: text;
  }
  .panel .row { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }

  .hint { font-size: 10.5px; color: var(--fg2); opacity: 0.85; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="bubble" class="bubble" hidden>…</div>

    <div id="card" class="card" role="button" tabindex="0"
         aria-label="点击通知 AI 来询问有什么要补充的">
      <span id="mascot" class="mascot">
        <svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6fb6ff"/>
              <stop offset="1" stop-color="#2f7de1"/>
            </linearGradient>
            <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5aa8f5"/>
              <stop offset="1" stop-color="#2a6fd0"/>
            </linearGradient>
          </defs>
          <g class="spout">
            <circle cx="27" cy="7"  r="2.4" fill="#9fd0ff"/>
            <circle cx="22" cy="11" r="1.7" fill="#bcdcff"/>
            <circle cx="32" cy="11" r="1.7" fill="#bcdcff"/>
          </g>
          <g class="whale">
            <!-- 尾巴 -->
            <path d="M49 33c3.5-1.2 6.5-.6 9 1.6-2.6 1.2-4 3-4.4 5.6 3-1.6 6-1.6 9 .2-3.4 3.4-7.6 4.4-12.2 2.8z"
                  fill="url(#tail)"/>
            <!-- 身体 -->
            <path d="M10 36.5C10 27 19.4 20 31.5 20c8.2 0 14.6 3.4 18.3 8.8 1.5 2.2 2 4.6 1.6 7.2-1 6.6-8.2 11.4-19.4 11.4C20 47.4 10 43.4 10 36.5z"
                  fill="url(#wg)"/>
            <!-- 肚皮 -->
            <path d="M15.5 40.2c4.2 3.4 10 5.2 16.6 5.2 7 0 13-1.9 17-5.4-3.8-2-10-3-17-3-6.8 0-12.7 1-16.6 3.2z"
                  fill="#e3f1ff" opacity="0.9"/>
            <!-- 眼睛 -->
            <circle cx="24.5" cy="31" r="2.7" fill="#15233b"/>
            <circle cx="25.5" cy="30.1" r="0.95" fill="#ffffff"/>
            <!-- 腮红 -->
            <ellipse cx="31" cy="36.4" rx="3.1" ry="1.8" fill="#ffb3c1" opacity="0.75"/>
            <!-- 嘴 -->
            <path d="M27.5 40.6c1.5 1.1 3.4 1.1 5 0" stroke="#2a6fd0" stroke-width="1.4"
                  stroke-linecap="round" fill="none" opacity="0.85"/>
          </g>
        </svg>
      </span>

      <span class="meta">
        <span class="title">补充提示挂件</span>
        <span class="status"><i id="dot" class="dot"></i><span id="statusText">点我，AI 马上来问你</span></span>
      </span>

      <span class="actions">
        <button id="floatBtn" class="btn" type="button">悬浮</button>
      </span>
    </div>

    <div id="panel" class="panel" hidden>
      <div id="panelTip">自动通知失败，可手动把下面这句话发给我：</div>
      <textarea id="manualText" readonly spellcheck="false"></textarea>
      <div class="row">
        <button id="copyBtn" class="btn" type="button">复制这段话</button>
      </div>
    </div>

    <div id="footHint" class="hint" hidden>本地预览模式：未连接 WorkBuddy 宿主，点击仅演示效果</div>
  </div>

  <!-- ext-apps 客户端库（离线内联，构建脚本注入） -->
  <script type="module">
/*__SUPP_EXT_BUNDLE__*/
  </script>

  <!-- 挂件逻辑 -->
  <script type="module">
    const EXT = globalThis.__SUPP_EXT__ || {};
    const App = EXT.App;
    const $ = (id) => document.getElementById(id);

    const STATUS = {
      idle:    ['',   '点我，AI 马上来问你'],
      wait:    ['wait', '已通知 AI，等它来提问…'],
      ok:      ['ok', 'AI 已收到，准备补充吧'],
      err:     ['err', '自动通知不可用，见下方手动模式'],
    };

    const CLICK_SEQ = [
      '已通知 AI ✓',
      '它马上就抽空来问你',
      '想补充什么，先理一理～',
      '不用打断，继续干你的活',
    ];

    let app = null;
    let sim = false;               // 预览/模拟模式
    let sending = false;
    let lastSentAt = 0;
    let seqTimer = null;
    let resetTimer = null;
    let bubbleTimer = null;
    let autoFloatTried = false;    // 首次拿到打开参数后自动悬浮只尝试一次

    /* ---------------- 基础工具 ---------------- */
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    function setStatus(kind, textOverride) {
      const [cls, text] = STATUS[kind] || STATUS.idle;
      $('dot').className = 'dot' + (cls ? ' ' + cls : '');
      $('statusText').textContent = textOverride || text;
    }

    function bubble(text, duration = 2400) {
      const b = $('bubble');
      b.hidden = false;
      b.textContent = text;
      // 重放进场动画
      b.style.animation = 'none';
      void b.offsetWidth;
      b.style.animation = '';
      if (bubbleTimer) clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => { b.hidden = true; }, duration);
    }

    function stopSeq() {
      if (seqTimer) { clearInterval(seqTimer); seqTimer = null; }
      if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
    }

    function hop() {
      const m = $('mascot');
      m.classList.remove('hop');
      void m.offsetWidth;
      m.classList.add('hop');
      setTimeout(() => m.classList.remove('hop'), 950);
    }

    function toast(msg) { bubble(msg, 2000); }

    /* ---------------- 主题 / 显示模式 ---------------- */
    function applyTheme(theme) {
      if (!theme) return;
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    }

    function syncDisplayMode(ctx) {
      const host = (app && app.getHostContext()) || {};
      const mode = (ctx && ctx.displayMode) || host.displayMode || 'inline';
      document.body.classList.toggle('pip', mode === 'pip');
      const btn = $('floatBtn');
      const avail = host.availableDisplayModes;
      const pipOk = Array.isArray(avail) ? avail.indexOf('pip') !== -1 : true;
      if (!pipOk) {
        btn.textContent = '悬浮不可用';
        btn.title = '当前宿主不支持悬浮显示；想要常驻可拖动的小鲸鱼，请使用桌面版挂件（屏幕右下角）';
        btn.disabled = true;
        btn.classList.remove('on');
        return;
      }
      btn.disabled = false;
      btn.textContent = mode === 'pip' ? '收回' : '悬浮';
      btn.classList.toggle('on', mode === 'pip');
      btn.title = mode === 'pip' ? '收回到底部对话里' : '把挂件悬浮在窗口角落';
    }

    /* ---------------- 注入文案（核心） ---------------- */
    function buildContextText(evId) {
      return '【补充提示挂件 · 事件 ' + evId + '】用户刚刚按下了「补充提示」挂件，希望在当前任务继续之前补充提示词。' +
        '请在你这一个动作里立即调用 AskUserQuestion 工具，向用户提问：「有什么要补充的吗？」，并等待用户回答后再继续任务；' +
        '不要推迟到整个任务完成之后。如果对话里已经出现同一事件（' + evId + '）的挂件用户消息且你已经问过，则忽略本提醒，不要重复提问。';
    }

    function buildMessageText(evId) {
      return '⚡️【补充提示挂件 · 事件 ' + evId + '】我想先补充一些提示，再让你继续。' +
        '请立即调用 AskUserQuestion（提问）工具问我：「有什么要补充的吗？」，等我回答以后再把补充内容纳入计划继续执行，不要等任务全部做完才问。' +
        '如果你已经通过同一条事件（' + evId + '）问过我，就忽略这条消息。';
    }

    /* ---------------- 发送流程 ---------------- */
    async function sendPing() {
      const now = Date.now();
      if (sending) return;
      if (now - lastSentAt < 6000) { toast('刚刚已经通知过啦，稍等一下～'); return; }
      sending = true;

      hop();
      const evId = 'sup-' + now.toString(36) + '-' + Math.random().toString(36).slice(2, 6);
      const ctxText = buildContextText(evId);
      const msgText = buildMessageText(evId);

      if (sim || !app) {
        lastSentAt = now;
        setStatus('wait', '预览模式：模拟通知成功');
        runSeq();
        showPanel('本地预览模式（未连接宿主）。真实环境下会向 AI 注入以下内容：', msgText);
        sending = false;
        return;
      }

      let okCtx = false;
      let okMsg = false;
      const errs = [];

      try {
        await app.updateModelContext({ content: [{ type: 'text', text: ctxText }] });
        okCtx = true;
      } catch (e) { errs.push('context: ' + (e && e.message ? e.message : e)); }

      try {
        const r = await app.sendMessage({ role: 'user', content: [{ type: 'text', text: msgText }] });
        okMsg = !(r && r.isError);
        if (r && r.isError) errs.push('message: host rejected');
      } catch (e) { errs.push('message: ' + (e && e.message ? e.message : e)); }

      if (okCtx || okMsg) {
        lastSentAt = now;
        setStatus('wait');
        runSeq();
        if (!okMsg) {
          // 消息回写失败但上下文注入成功：依然有效，顺带提示
          $('panelTip').textContent = '上下文注入已生效；如 AI 没有反应，可手动发送：';
          showPanel(null, msgText);
        }
      } else {
        setStatus('err');
        $('panelTip').textContent = '自动通知失败，可手动把下面这句话发给我：';
        showPanel(null, msgText);
        console.warn('[supplement-widget] send failed:', errs);
      }
      sending = false;
    }

    function runSeq() {
      stopSeq();
      let i = 0;
      bubble(CLICK_SEQ[0]);
      i = 1;
      seqTimer = setInterval(() => {
        if (i >= CLICK_SEQ.length) { clearInterval(seqTimer); seqTimer = null; return; }
        bubble(CLICK_SEQ[i]);
        i += 1;
      }, 2300);
      if (resetTimer) clearTimeout(resetTimer);
      resetTimer = setTimeout(() => {
        setStatus('idle');
        $('panel').hidden = true;
      }, 90000);
    }

    function showPanel(tip, text) {
      if (tip) $('panelTip').textContent = tip;
      $('manualText').value = text;
      $('panel').hidden = false;
    }

    /* ---------------- 悬浮切换 ---------------- */
    async function requestFloat(mode, silent) {
      if (sim || !app) { if (!silent) toast('预览模式下不可用'); return; }
      try {
        const r = await app.requestDisplayMode({ mode });
        syncDisplayMode({ displayMode: (r && r.mode) || mode });
        if (!silent && r && r.mode !== mode) {
          toast('宿主不支持' + (mode === 'pip' ? '悬浮' : '收回') + '；常驻可拖动请用桌面版挂件');
        }
      } catch (e) {
        if (!silent) toast('切换失败：' + (e && e.message ? e.message : e));
      }
    }

    async function toggleFloat() {
      const ctx = (app && app.getHostContext()) || {};
      const cur = ctx.displayMode || 'inline';
      await requestFloat(cur === 'pip' ? 'inline' : 'pip', false);
    }

    /* ---------------- 启动 ---------------- */
    async function boot() {
      $('card').addEventListener('click', sendPing);
      $('card').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sendPing(); }
      });
      $('floatBtn').addEventListener('click', (e) => { e.stopPropagation(); toggleFloat(); });
      $('copyBtn').addEventListener('click', async (e) => {
        e.stopPropagation();
        const ta = $('manualText');
        ta.select();
        try {
          await navigator.clipboard.writeText(ta.value);
        } catch {
          document.execCommand('copy');
        }
        toast('已复制 ✓');
      });

      const inIframe = (() => { try { return window.parent && window.parent !== window; } catch { return true; } })();
      if (!App) { enterSim('ext-apps 库未加载'); return; }
      if (!inIframe) { enterSim('未连接宿主'); return; }

      try {
        app = new App({ name: 'supplement-widget', version: '1.0.0' }, {}, { autoResize: true });
        app.onhostcontextchanged = (ctx) => {
          if (ctx) {
            if (ctx.theme) applyTheme(ctx.theme);
            syncDisplayMode(ctx);
          }
        };
        app.ontoolresult = (r) => {
          // 首次拿到打开参数：float !== false 时自动请求悬浮（对应「打开悬浮挂件」）
          if (!autoFloatTried && r && r.structuredContent && r.structuredContent.float !== false) {
            autoFloatTried = true;
            setTimeout(() => requestFloat('pip', true), 350);
          }
        };
        await withTimeout(app.connect(), 8000);
        applyTheme(app.getHostContext()?.theme);
        syncDisplayMode(app.getHostContext());
        setStatus('idle');
      } catch (e) {
        enterSim('连接宿主失败：' + (e && e.message ? e.message : e));
      }
    }

    function withTimeout(p, ms) {
      return new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error('timeout')), ms);
        Promise.resolve(p).then(
          (v) => { clearTimeout(t); resolve(v); },
          (e) => { clearTimeout(t); reject(e); }
        );
      });
    }

    function enterSim(reason) {
      sim = true;
      $('footHint').hidden = false;
      $('footHint').textContent = '本地预览模式（' + reason + '）：点击仅演示效果';
      setStatus('idle', '预览模式 · 点击看效果');
      $('floatBtn').disabled = true;
      // 支持 ?autoclick=1 自动演示
      const q = new URLSearchParams(location.search);
      if (q.get('autoclick')) setTimeout(sendPing, 500);
    }

    boot();
  </script>
</body>
</html>
